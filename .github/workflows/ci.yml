name: Lean CI (Paper 2)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          use-mathlib-cache: true
      - name: Namespace-wide axiom audit (fails on any axiom outside propext, Classical.choice, Quot.sound)
        run: lake env lean scripts/NamespaceAxiomAudit.lean
      - name: Declaration-level axiom report
        run: lake env lean AxiomsAudit.lean | tee axioms_report.txt
      - name: Reject proof placeholders, project axioms, opaque declarations, unsafe code and native evaluation
        run: |
          if grep -rnwE 'sorry|admit|axiom|opaque|unsafe|native_decide' TermCoding TermCodingDispersion.lean TermCodingDispersionVerified.lean TermCodingDispersionConditional.lean --include='*.lean'; then
            echo "forbidden token found"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: axioms_report
          path: axioms_report.txt
