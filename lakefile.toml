name = "TermCoding"
defaultTargets = ["TermCoding", "TermCodingDispersion"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.26.0"

# Paper 1 release (reused unchanged) plus the Paper 2 modules under
# TermCoding/Dispersion/.
[[lean_lib]]
name = "TermCoding"

# Unconditional Paper 2 results.
[[lean_lib]]
name = "TermCodingDispersionVerified"

# Results stated from the explicit external hypothesis.
[[lean_lib]]
name = "TermCodingDispersionConditional"

# Everything.
[[lean_lib]]
name = "TermCodingDispersion"
